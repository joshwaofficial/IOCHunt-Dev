# ════════════════════════════════════════════════════════════════
# IOC Hunt — Unified Platform Docker Compose
# ════════════════════════════════════════════════════════════════
# Simple 3-Service Architecture:
#   1. db:    PostgreSQL 16 Multi-Tenant Database
#   2. app:   Unified Platform (Central Server or Aggregator)
#   3. nginx: TLS Reverse Proxy & SSL Termination
#
# Usage:
#   docker compose up -d          # Start platform
#   docker compose logs -f        # View live logs
#   docker compose down           # Stop platform
# ════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL 16 Multi-Tenant Database ───────────────────────
  db:
    image: postgres:16-alpine
    container_name: iochunt-db-${TENANT_ID:-default}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iochunt_password}
      POSTGRES_DB: ${POSTGRES_DB:-iochunt_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - db-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── IOC Hunt Unified Application (Backend + Built Frontend) ──
  app:
    image: iochunt-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iochunt-app-${TENANT_ID:-default}
    environment:
      NODE_ENV: production
      PORT: 4001
      INSTANCE_MODE: ${INSTANCE_MODE:-central_server} # central_server OR aggregator
      DEPLOYMENT_MODE: cloud # Force cloud SaaS mode to ensure tenant isolation
      TENANT_ID: ${TENANT_ID:-default}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-iochunt_password}@iochunt-db-${TENANT_ID:-default}:5432/${POSTGRES_DB:-iochunt_db}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855}
      API_KEY: ${API_KEY:-iochunt-change-me}
      REDIS_URL: ${REDIS_URL:-redis://iochunt-redis-${TENANT_ID:-default}:6379}
      FRONTEND_URL: ${FRONTEND_URL:-*}
      DISPLAY_TZ: ${DISPLAY_TZ:-Asia/Kolkata}
      APP_VERSION: ${APP_VERSION:-2.0.0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@iochunt.local}
    ports:
      - "${APP_PORT:-4001}:4001"
      - "${SYSLOG_PORT:-5514}:5514/udp" # Syslog receiver for branch firewalls/switches
    volumes:
      - ./nginx/ssl:/app/nginx/ssl
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - db-net
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Nginx TLS Reverse Proxy ───────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: iochunt-nginx-${TENANT_ID:-default}
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8082}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/health || wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Redis (In-Memory Queue & Cache) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: iochunt-redis-${TENANT_ID:-default}
    restart: unless-stopped
    networks:
      - db-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Adminer (Web Database GUI) ────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: iochunt-adminer-${TENANT_ID:-default}
    restart: unless-stopped
    ports:
      - "8088:8080"
    networks:
      - db-net
    depends_on:
      db:
        condition: service_healthy

# ── Volumes ────────────────────────────────────────────────────
volumes:
  pgdata:
    name: iochunt-pgdata-${TENANT_ID:-default}

# ── Networks ───────────────────────────────────────────────────
networks:
  app-net:
    name: iochunt-app-net-${TENANT_ID:-default}
    driver: bridge
  db-net:
    name: iochunt-db-net-${TENANT_ID:-default}
    driver: bridge
