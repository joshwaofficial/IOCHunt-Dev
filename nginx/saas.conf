upstream backend_app {
    server app:4001;
}

server {
    listen 80;
    server_tokens off;
    server_name _;

    # Redirect all HTTP traffic to HTTPS (308 preserves POST body for API agents)
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_tokens off;
    server_name _;

    ssl_certificate /etc/nginx/ssl/iochunt.crt;
    ssl_certificate_key /etc/nginx/ssl/iochunt.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (Strict-Transport-Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Health check endpoint for Docker Compose
    location /health {
        access_log off;
        return 200 "OK";
    }

    # API Requests
    location /api/ {
        proxy_pass https://backend_app;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE Support
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SSE Stream Endpoint specific settings
    location /api/stream {
        proxy_pass https://backend_app;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frontend Static Files
    location / {
        proxy_pass https://backend_app;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
