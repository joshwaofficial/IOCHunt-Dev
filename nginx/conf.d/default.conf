# ════════════════════════════════════════════════════════════════
# IOC Hunt — Unified Platform Nginx Reverse Proxy Config
# ════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect all plain HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Internal Health Check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # TLS Certificates (Mount custom certs into /etc/nginx/ssl/)
    ssl_certificate     /etc/nginx/ssl/iochunt.crt;
    ssl_certificate_key /etc/nginx/ssl/iochunt.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Auto-redirect if user hits HTTPS port with plain HTTP
    error_page 497 https://$host:$server_port$request_uri;

    # Maximum request size (allows large gzip batch log uploads)
    client_max_body_size 50M;

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Proxy all traffic to the Unified App container (Strict HTTPS)
    location / {
        proxy_pass https://app:4001;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & SSE (Server-Sent Events) support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}
