# ════════════════════════════════════════════════════════════
# IOC Hunt — Central Dashboard Server Block
# ════════════════════════════════════════════════════════════

# HTTP → HTTPS redirect
server {
    listen 9090;
    server_name _;

    # Health check endpoint for Docker
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host:9443$request_uri;
    }
}

# HTTPS server — Central Dashboard
server {
    listen 9443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/central.crt;
    ssl_certificate_key /etc/nginx/ssl/central.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Central Dashboard (React SPA) ───────────────────────
    location / {
        root /usr/share/nginx/html/central;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Central Backend API ─────────────────────────────────
    location /api/ {
        proxy_pass http://central-backend:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) support
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # ── Aggregator Dashboard ────────────────────────────────
    location /aggregator/ {
        alias /usr/share/nginx/html/aggregator/;
        index index.html;
        try_files $uri $uri/ /aggregator/index.html;
    }

    # ── Aggregator Backend API ──────────────────────────────
    location /aggregator/api/ {
        rewrite ^/aggregator/api/(.*) /api/$1 break;
        proxy_pass http://aggregator-backend:4011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}
