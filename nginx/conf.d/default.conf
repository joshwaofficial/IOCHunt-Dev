# ════════════════════════════════════════════════════════════
# IOC Hunt — Split Architecture Nginx Config
# ════════════════════════════════════════════════════════════

# ── Aggregator Server (Frontend: 8082) ──────────────────────
server {
    listen 8082 ssl;
    server_name _;

    # Enable SSL for Aggregator
    ssl_certificate     /etc/nginx/ssl/central.crt;
    ssl_certificate_key /etc/nginx/ssl/central.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Auto-redirect if user accidentally types http:// instead of https://
    error_page 497 301 =307 https://$host:$server_port$request_uri;

    # Health check endpoint for Docker
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ── Aggregator Dashboard (React SPA) ────────────────────
    location / {
        root /usr/share/nginx/html/aggregator;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Aggregator Backend API ──────────────────────────────
    location /api/ {
        proxy_pass http://aggregator-backend:4001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}

# ── Central Server (Frontend: 8083) ─────────────────────────
server {
    listen 8083 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/central.crt;
    ssl_certificate_key /etc/nginx/ssl/central.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Auto-redirect if user accidentally types http:// instead of https://
    error_page 497 301 =307 https://$host:$server_port$request_uri;

    # ── Central Dashboard (React SPA) ───────────────────────
    location / {
        root /usr/share/nginx/html/central;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Central Backend API ─────────────────────────────────
    location /api/ {
        proxy_pass http://central-backend:4002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) support
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}
