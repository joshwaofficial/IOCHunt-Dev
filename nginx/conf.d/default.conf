# ════════════════════════════════════════════════════════════════
# IOC Hunt — Unified Platform Nginx Reverse Proxy Config
# ════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_tokens off;
    server_name _;

    # Redirect all plain HTTP traffic to HTTPS (308 preserves POST body for API agents)
    location / {
        return 308 https://$host$request_uri;
    }

    # Internal Health Check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_tokens off;
    server_name _;

    # TLS Certificates (Mount custom certs into /etc/nginx/ssl/)
    ssl_certificate     /etc/nginx/ssl/iochunt.crt;
    ssl_certificate_key /etc/nginx/ssl/iochunt.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (Strict-Transport-Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Auto-redirect if user hits HTTPS port with plain HTTP
    error_page 497 https://$host:$server_port$request_uri;

    # Maximum request size (allows large gzip batch log uploads)
    client_max_body_size 50M;

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ── Static Frontend Assets (Hashed & Immutable from Vite) ──
    location /assets/ {
        proxy_pass https://app:4001;
        proxy_ssl_verify off;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enable proxy buffering so Nginx can gzip compress the 2.5MB assets down to ~700KB
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 128k;

        # Browser caching for hashed assets
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Dedicated SSE (Server-Sent Events) Stream Endpoint ──────
    location /api/stream {
        proxy_pass https://app:4001;
        proxy_ssl_verify off;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering strictly for SSE to allow real-time event streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # ── General API & Navigation Proxy ───────────────────────────
    location / {
        proxy_pass https://app:4001;
        proxy_ssl_verify off;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enable proxy buffering so Nginx gzip compresses API JSON and HTML
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
        proxy_busy_buffers_size 64k;
        proxy_read_timeout 120s;
    }
}
