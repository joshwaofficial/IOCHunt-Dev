name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-and-build:
    name: Lint & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ── Frontend Checks ──
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # ── Backend Checks ──
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Validate Backend Syntax
        working-directory: backend
        run: |
          node -c src/server.js
          node -c src/config/db.js
          node -c src/config/redisClient.js

      # ── Super Admin Checks ──
      - name: Install Super Admin Frontend Dependencies
        working-directory: super-admin/frontend
        run: npm ci || npm install

      - name: Build Super Admin Frontend
        working-directory: super-admin/frontend
        run: npm run build

      - name: Validate Super Admin Backend Syntax
        working-directory: super-admin
        run: node -c backend/server.js

  docker-build-check:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: validate-and-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Platform Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: iochunt-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
