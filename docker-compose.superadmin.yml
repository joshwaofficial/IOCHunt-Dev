version: "3.8"

services:
  super-admin:
    build:
      context: .
      dockerfile: super-admin/Dockerfile
    container_name: iochunt-super-admin
    ports:
      - "8083:4001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - SUPER_ADMIN_PORT=4001
      - SERVE_STATIC=true
      - SUPER_ADMIN_DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-iochunt_password}@iochunt-db-default:5432/${POSTGRES_DB:-iochunt_db}
      - HOST_PWD=${HOST_PWD:-/app}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - db-net

networks:
  db-net:
    external: true
    name: iochunt-db-net-default
