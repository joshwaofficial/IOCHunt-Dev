# ════════════════════════════════════════════════════════════════
# IOC Hunt — Aggregator Docker Compose
# ════════════════════════════════════════════════════════════════
# This spins up an isolated Aggregator instance using the same codebase
# but a separate database, network, and ports to avoid conflicts with 
# the central server.
#
# Usage:
#   docker compose -f docker-compose.aggregator.yml up -d --build
# ════════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL 16 Isolated Database ───────────────────────
  db:
    image: postgres:16-alpine
    container_name: iochunt-db-aggregator
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: iochunt_password
      POSTGRES_DB: iochunt_db
    volumes:
      - pgdata-aggregator:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - db-net-aggregator
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── IOC Hunt Aggregator Application ───────────────────────
  app:
    image: iochunt-app-aggregator:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iochunt-app-aggregator
    environment:
      NODE_ENV: production
      PORT: 4001
      INSTANCE_MODE: aggregator
      IS_CENTRAL_SERVER: "false"
      TENANT_ID: aggregator
      DATABASE_URL: postgres://postgres:iochunt_password@iochunt-db-aggregator:5432/iochunt_db
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855}
      REDIS_URL: redis://iochunt-redis-aggregator:6379
      DISPLAY_TZ: Asia/Kolkata
      APP_VERSION: 2.0.0
    ports:
      - "5516:5514/udp" # Syslog receiver
    volumes:
      - ./nginx/ssl:/app/nginx/ssl
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - db-net-aggregator
      - app-net-aggregator
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Nginx TLS Reverse Proxy ───────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: iochunt-nginx-aggregator
    ports:
      - "8086:80"   # Exposed on 8086 to avoid any zombie port conflicts
      - "8084:443"  # Aggregator UI/API fixed to port 8084
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/health || wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-net-aggregator
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Redis (In-Memory Queue & Cache) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: iochunt-redis-aggregator
    restart: unless-stopped
    networks:
      - db-net-aggregator
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# ── Volumes ────────────────────────────────────────────────────
volumes:
  pgdata-aggregator:
    name: iochunt-pgdata-aggregator

# ── Networks ───────────────────────────────────────────────────
networks:
  app-net-aggregator:
    name: iochunt-app-net-aggregator
    driver: bridge
  db-net-aggregator:
    name: iochunt-db-net-aggregator
    driver: bridge
